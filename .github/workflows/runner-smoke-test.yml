name: Self-hosted runner smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    # Runs on the docker-desktop self-hosted runner registered from compose.local.yml
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Runner environment
        run: |
          echo "Runner: $RUNNER_NAME"
          uname -a
          cat /etc/os-release | head -2
          docker --version || true
      - name: Check Rust toolchain availability
        run: rustc --version || echo "rustc not preinstalled in runner image"
